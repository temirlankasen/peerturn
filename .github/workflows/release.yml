name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable release ref belongs to main
        run: |
          test "$GITHUB_REF_TYPE" = tag
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Download and verify clean release modules
        run: |
          go clean -modcache -cache
          go mod download
          go mod verify
      - run: scripts/publish-check.sh --cached --strict-index
      - run: make ci

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Download and verify clean release modules
        run: |
          go clean -modcache -cache
          go mod download
          go mod verify
      - name: Refuse to modify an already published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
            --jq '.[] | {tag_name, draft}' |
            jq --slurp --exit-status --arg tag "$RELEASE_TAG" \
              '[.[] | select(.tag_name == $tag)] | all(.draft == true)'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: v1.55.0
      - name: Add Syft to PATH
        env:
          SYFT_COMMAND: ${{ steps.syft.outputs.cmd }}
        run: dirname "$SYFT_COMMAND" >> "$GITHUB_PATH"
      - name: Build archives, SBOMs, and checksums into a draft release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign the checksum manifest with GitHub OIDC
        run: |
          for manifest in dist/*_checksums.txt; do
            cosign sign-blob --yes --bundle "${manifest}.sigstore.json" "$manifest"
          done
      - name: Attest archives, SBOMs, installers, and the checksum manifest
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.sbom.json
            dist/*_checksums.txt
            scripts/install.sh
            install.ps1
      - name: Attach verification bundles and publish the completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" dist/peerturn-provenance.sigstore.json
          gh release upload "$RELEASE_TAG" dist/*.sigstore.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false
